[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-helmet-violation-detection"
version = "1.0.0"
description = "Edge AI Smart Helmet Traffic Violation Detection System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Smart Helmet Team" }]
dependencies = [
    "ultralytics>=8.1.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "albumentations>=1.3.1",
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
    "PyYAML>=6.0.1",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tensorboard>=2.15.0",
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.16.0",
    "filterpy>=1.4.5",
    "scipy>=1.11.0",
    "pillow>=10.1.0",
    "imagehash>=4.3.1",
    "geopy>=2.4.0",
    "reportlab>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
tensorrt = ["nvidia-tensorrt>=8.6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "training*", "inference*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
