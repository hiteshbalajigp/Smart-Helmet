# Dataset configuration
dataset:
  root: datasets/processed
  raw_videos: datasets/raw/videos
  raw_images: datasets/raw/images
  classes:
    - person
    - motorcycle
    - helmet
    - no_helmet
    - license_plate
  class_targets:
    helmet: 5000
    no_helmet: 5000
    motorcycle: 5000
    triple_riding: 3000
    license_plate: 5000
  split_ratios:
    train: 0.7
    val: 0.2
    test: 0.1
  frame_extraction:
    interval_sec: 0.5
    max_frames_per_video: 1000
  dedup:
    hash_threshold: 5

# Augmentation
augmentation:
  image_size: 640
  rotation_limit: 15
  brightness_limit: 0.3
  contrast_limit: 0.3
  motion_blur_limit: 7
  gaussian_noise_var: [10, 50]
  rain_intensity: 0.3
  shadow_intensity: 0.4
  low_light_factor: 0.4
  perspective_scale: 0.05
  mosaic_prob: 0.5
  mixup_prob: 0.3

# Training
training:
  model: yolov8m.pt
  epochs: 180
  patience: 30
  batch_size: 16
  imgsz: 640
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: true
  amp: true
  workers: 8
  seed: 42
  project: models/checkpoints
  name: helmet_violation_yolov8m
  save_period: 10
  resume: false

# Camera subsystem
camera:
  camera_id: HELMET-CAM-01
  camera_index: 0
  camera_width: 1920
  camera_height: 1080
  camera_fps: 30
  camera_backend: auto
  camera_reconnect_enabled: true
  camera_reconnect_delay: 2.0

# YOLOv8 stage 3 configuration
yolo:
  model_path: model_weights/yolo/best.pt
  confidence_threshold: 0.25
  iou_threshold: 0.45
  image_size: 640
  device: auto
  max_detections: 300
  visualization_enabled: false

# Stage 4 vehicle/person tracking and association
tracking:
  enabled: true
  max_missed_frames: 5
  min_confidence: 0.25
  match_threshold: 0.3
  person_classes: [person]
  vehicle_classes: [motorcycle, motorbike, two-wheeler, two_wheeler]
  association_enabled: true
  association_threshold: 0.45
  role_assignment_threshold: 0.65

# Inference
inference:
  model_path: models/checkpoints/helmet_violation_yolov8m/weights/best.pt
  onnx_path: models/onnx/helmet_violation.onnx
  tensorrt_path: models/tensorrt/helmet_violation.engine
  confidence: 0.45
  iou: 0.5
  tracker: bytetrack.yaml
  device: auto
  max_fps: 30

# Violation rules
violations:
  helmet_iou_threshold: 0.25
  rider_motorcycle_iou: 0.15
  triple_riding_threshold: 2
  cooldown_sec: 10.0
  min_confidence: 0.45
  no_helmet_confidence: 0.40
  head_region_ratio: 0.35
  detect_standalone_no_helmet: true
  require_motorcycle: false
  no_helmet_only: true

# License plate
license_plate:
  wpod_model_path: models/wpod/wpod-net.h5
  min_plate_width: 80
  min_plate_height: 20
  skew_correction: true
  perspective_correction: true

# OCR
ocr:
  lang: en
  use_angle_cls: true
  indian_plate_patterns:
    - '^[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{4}$'
    - '^[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{4}$'
    - '^[0-9]{2}BH[0-9]{4}[A-Z]{1,2}$'

# Evidence capture
evidence:
  buffer_seconds_before: 10
  buffer_seconds_after: 10
  fps: 30
  output_dir: evidence
  jpeg_quality: 90
  video_codec: mp4v

# Metadata
metadata:
  device_id: HELMET-001
  timezone: Asia/Kolkata
  gps_enabled: true
  gps_port: /dev/ttyUSB0
  gps_baudrate: 9600

# Backend
backend:
  host: 0.0.0.0
  port: 8000
  api_prefix: /api/v1
  cors_origins:
    - http://localhost:5173
    - http://localhost:3000
  secret_key: change-me-in-production
  evidence_storage: evidence

# Database
database:
  url: postgresql+asyncpg://postgres:postgres@localhost:5432/helmet_violations
  sync_url: postgresql://postgres:postgres@localhost:5432/helmet_violations
  pool_size: 10
  echo: false

# Edge optimization
edge:
  onnx_opset: 17
  tensorrt_fp16: true
  tensorrt_int8: false
  max_batch_size: 1
  workspace_size_mb: 1024

# Logging
logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: logs/app.log
